name: Lint & Typecheck
on:
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize]
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    format:
        name: Format with ruff
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: |
            github.event.pull_request.head.repo.full_name == github.repository &&
            format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: ${{ github.head_ref }}

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: Install ruff
              run: pip install -U --group lint

            - name: Run ruff format
              run: ruff format . --exclude docs/

            - name: Run ruff lint fixes
              run: ruff check --fix . --exclude docs/

            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A

                  if ! git diff --cached --quiet; then
                    git commit -m "format(ruff) [ci skip]"
                    git show HEAD
                    git push
                  else
                    echo "No changes required"
                  fi

    lint-check:
        name: Lint check with ruff
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: |
            github.event.pull_request.head.repo.full_name != github.repository &&
            format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: Install ruff
              run: pip install -U --group lint

            - name: Check ruff formatting
              run: ruff format --check . --exclude docs/

            - name: Check ruff lint
              run: ruff check . --exclude docs/

    typecheck:
        name: Typecheck / ${{ matrix.adapter }}
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
        strategy:
            fail-fast: false
            matrix:
                adapter: [discord.py, py-cord, disnake, nextcord]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: |
                      pyproject.toml

            - name: Install project and basedpyright
              run: pip install -U -e ".[speed]" --group typecheck

            - name: Install ${{ matrix.adapter }} in isolation
              run: |
                  pip uninstall -y discord.py py-cord disnake nextcord 2>/dev/null || true
                  pip install "${{ matrix.adapter }}"

            - name: Install basedpyright
              run: pip install -U --group typecheck

            - name: Run basedpyright
              env:
                  TMPDIR: ${{ runner.temp }}
              run: |
                  FILES=$(find sonolink -name '*.py' -not -name '_pycord.py' -not -name '_dpy.py' -not -name '_disnake.py' -not -name '_nextcord.py')
                  case "${{ matrix.adapter }}" in
                    "discord.py") FILES="$FILES $(find sonolink -name '_dpy.py')" ;;
                    "py-cord")    FILES="$FILES $(find sonolink -name '_pycord.py')" ;;
                    "disnake")    FILES="$FILES $(find sonolink -name '_disnake.py')" ;;
                    "nextcord")   FILES="$FILES $(find sonolink -name '_nextcord.py')" ;;
                  esac
                  basedpyright $FILES
