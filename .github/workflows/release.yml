name: PyPI Release

on:
    release:
        types: [published]

jobs:
    build:
        permissions:
            contents: read
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: Install build frontend
              run: python3 -m pip install build twine --user

            - name: Build sdist & wheel
              run: python3 -m build

            - name: Check distributions
              run: python3 -m twine check --strict dist/*

            - name: Upload build artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: dist
                  path: dist/
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish to PyPI
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 15

        environment:
            name: pypi
            url: https://pypi.org/project/sonolink/

        permissions:
            id-token: write
            attestations: write
            contents: read

        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: dist
                  path: dist/

            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/*"

            - name: Push to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  print-hash: true

    bump-version:
        permissions:
            contents: write
        name: Bump version for development
        needs: [publish]
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  ref: ${{ github.event.release.target_commitish || github.event.repository.default_branch }}

            - name: Run bump script
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              with:
                  script: |
                      const path = require('path');
                      const script = require(path.resolve('.github/scripts/bump-version.js'));
                      await script({ core, context });

            - name: Commit and push version changes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  git add -A

                  if ! git diff --cached --quiet; then
                    git commit -m "chore(version): bump version to ${NEW_VERSION}"
                    git show HEAD
                    git push
                  else
                    echo "No changes required"
                  fi
