name: Test Suite
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest / py${{ matrix.python-version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project and test deps
        run: pip install -U -e . --group tests

      - name: Run pytest
        run: pytest
